version: '3.8'

services:
  # -------------------------------------------------------------
  # Web Application (Flask + Gunicorn WSGI Server)
  # -------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mainttech_web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_ENV=production
      - SECRET_KEY=mainttech-prod-super-secret-key-morocco-2026
      - DATABASE_URL=postgresql://mainttech:mainttech_secure_pass_2026@db:5432/mainttech_db
      - AUTO_SEED=true
      - USE_PROXY_FIX=true
      - SESSION_COOKIE_SECURE=false
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mainttech_network

  # -------------------------------------------------------------
  # Production Database (PostgreSQL 16)
  # -------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: mainttech_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=mainttech
      - POSTGRES_PASSWORD=mainttech_secure_pass_2026
      - POSTGRES_DB=mainttech_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mainttech -d mainttech_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mainttech_network

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  mainttech_network:
    driver: bridge
